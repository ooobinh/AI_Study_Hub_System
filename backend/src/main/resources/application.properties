spring.application.name=ai-study-hub-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AI_Study_Hub;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:SA}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
app.upload.dir=${UPLOAD_DIR:uploads}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:documents}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:AI Study Hub <onboarding@resend.dev>}
