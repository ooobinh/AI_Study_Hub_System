spring.application.name=ai-study-hub-backend

# Render sẽ cấp PORT tự động, local thì chạy 8080
server.port=${PORT:8080}

# Database SQL Server / Somee
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AI_Study_Hub;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:SA}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}

# Upload
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-document-size-bytes=${UPLOAD_MAX_FILE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Supabase
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:documents}

# Gemini
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Google Login
app.google.client-id=${GOOGLE_CLIENT_ID:}

# GitHub Login
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}

# Frontend URL
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# Session idle timeout (BR-13) — DB system_settings overrides when present
app.session.idle-minutes-default=${SESSION_IDLE_MINUTES:60}
app.session.max-minutes-default=${SESSION_MAX_MINUTES:720}

# Email / Resend
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:AI Study Hub <onboarding@resend.dev>}
